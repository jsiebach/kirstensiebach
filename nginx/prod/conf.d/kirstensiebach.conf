server {
    listen 80;
    listen [::]:80;

    server_name kirstensiebach.com www.kirstensiebach.com dev.kirstensiebach.com;
    server_tokens off;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://kirstensiebach.com$request_uri;
    }
}

server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;
    http2 on;

    # Tell browsers to always use HTTPS (no includeSubDomains/preload: those are hard to undo)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Match PHP's upload_max_filesize; nginx defaults to 1MB, which blocked phone photos
    client_max_body_size 40M;

    server_name kirstensiebach.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/kirstensiebach.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirstensiebach.com/privkey.pem;

    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Increase buffer sizes to handle large headers
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
    }

    location /storage {
        alias /var/www/storage/app/public/;
        try_files $uri /$uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}

# www and the retired dev subdomain redirect to the bare domain so there's one copy of the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.kirstensiebach.com dev.kirstensiebach.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/kirstensiebach.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kirstensiebach.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kirstensiebach.com$request_uri;
    }
}
