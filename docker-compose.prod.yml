# Rotate container logs so they can't grow without bound
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  #PHP Service
  app:
    logging: *default-logging
    image: jsiebach/kirstensiebach
    container_name: app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - ./php/prod/php-custom.ini:/usr/local/etc/php/conf.d/php-custom.ini
      - ./php/prod/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./.env:/var/www/.env
      - storage:/var/www/storage
    networks:
      - app-network

  #Nginx Service
  webserver:
    logging: *default-logging
    image: nginx:alpine
    container_name: webserver
    restart: unless-stopped
    tty: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx/prod/conf.d/:/etc/nginx/conf.d/
      - storage:/var/www/storage
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/letsencrypt/:ro
    networks:
      - app-network

  # let us encrypt, shall we?
  certbot:
    logging: *default-logging
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

  #MySQL Service
  db:
    logging: *default-logging
    image: mysql:8.4
    container_name: db
    restart: unless-stopped
    stop_grace_period: 2m
    tty: true
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    networks:
      - app-network

#Docker Networks
networks:
  app-network:
    driver: bridge

#Volumes
volumes:
  dbdata:
    driver: local
  storage:
    driver: local
