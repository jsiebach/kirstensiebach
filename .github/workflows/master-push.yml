on:
  push:
    branches: [ master ]

jobs:
  check-docker-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Docker build is needed
        id: check
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Files that should trigger Docker rebuild
          # - Dockerfile itself
          # - PHP source code (app/, bootstrap/, config/, database/, routes/)
          # - Composer dependencies (composer.json, composer.lock)
          # - Assets (resources/, package.json, package-lock.json, vite.config.js)
          # - Public files

          if echo "$CHANGED_FILES" | grep -qE '^(Dockerfile|app/|bootstrap/|config/|database/|routes/|resources/|public/|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.js)'; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🔨 Docker build needed - application code changed"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⚡ Skipping Docker build - no relevant changes detected"
          fi

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: check-docker-changes
    if: needs.check-docker-changes.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: intl, pdo_mysql, zip, exif, pcntl, gd
      - name: Install Dependencies
        run: composer install --no-interaction
      - name: Compile assets
        run: |
          npm install
          npm run production
      - name: Directory Permissions
        run: chmod -R 775 storage bootstrap/cache
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: jsiebach/kirstensiebach:latest
          cache-from: type=registry,ref=jsiebach/kirstensiebach:buildcache
          cache-to: type=registry,ref=jsiebach/kirstensiebach:buildcache,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: [check-docker-changes, build-and-push-docker-image]
    if: |
      always() &&
      needs.check-docker-changes.result == 'success' &&
      (needs.build-and-push-docker-image.result == 'success' || needs.build-and-push-docker-image.result == 'skipped')
    steps:
      - name: Deploy to production server
        uses: garygrossgarten/github-action-ssh@release
        with:
          command: cd /var/www/kirstensiebach && ./deploy.sh
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          privateKey: ${{ secrets.SSH_PRIVATE_KEY }}
