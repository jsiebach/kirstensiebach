on:
  pull_request:
    branches: [ dev ]
  workflow_call:

jobs:
  laravel-tests:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: intl, pdo_mysql, zip, exif, pcntl, gd
          coverage: xdebug
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress
      - name: Generate key
        run: php artisan key:generate
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compile assets
        run: |
          npm ci
          npm run build
      - name: Check committed assets match the source
        run: |
          if [ -n "$(git status --porcelain public/build)" ]; then
            git status --short public/build
            echo "::error::public/build is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Unit and feature tests
        run: XDEBUG_MODE=coverage php artisan test --testsuite=Unit,Feature --coverage-clover ./coverage.xml
      # Browser tests are timing-sensitive, so they report failures without blocking a deploy
      - name: Browser tests (non-blocking)
        id: browser-tests
        continue-on-error: true
        env:
          APP_URL: http://127.0.0.1:8000
        run: php artisan test --testsuite=Browser
      - name: Flag browser test failures
        if: steps.browser-tests.outcome == 'failure'
        run: echo "::warning::Browser tests failed (not blocking the deploy). See the 'Browser tests' step and the browser-screenshots artifact."
      - name: Upload Browser Screenshots on Failure
        if: steps.browser-tests.outcome == 'failure' || failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore
      - name: Check test coverage
        id: test-coverage
        uses: johanvanhelden/gha-clover-test-coverage-check@v1
        with:
          percentage: "80"
          filename: "coverage.xml"
          exit: false
      - name: Print test coverage
        run: echo "${{ steps.test-coverage.outputs.coverage }}"
