on:
  push:
    branches: [ dev ]

jobs:
  merge-dev-to-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Merge dev -> master
        uses: devmasx/merge-branch@v1.3.1
        with:
          type: now
          from_branch: dev
          target_branch: master
          github_token: ${{ secrets.GIT_TOKEN }}
